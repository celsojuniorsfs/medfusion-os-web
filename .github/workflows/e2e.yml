name: E2E

# web#48 — único e2e do repo de propósito, contra a API real (não mock). Sobe a API a partir do
# checkout de `medfusion-os-api@main` (repo público, dá pra fazer checkout cruzado sem PAT) com
# sqlite em arquivo (não `:memory:`, pra sobreviver entre requests de `php artisan serve`) e
# CACHE_STORE=array (sem serviço Valkey no runner — array funciona bem dentro de um processo único
# de vida curta como este). Credenciais do admin são fixas de propósito: o banco é descartável,
# criado do zero a cada run, não há nada sensível pra proteger com Secret.
on:
  push:
    branches: [main]
  pull_request:

env:
  ADMIN_EMAIL: e2e@medfusion.local
  ADMIN_PASSWORD: e2e-senha-de-teste

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout API (main)
        uses: actions/checkout@v4
        with:
          repository: celsojuniorsfs/medfusion-os-api
          ref: main
          path: api

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, zip
          coverage: none

      - name: Instalar dependências do Composer
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: api

      - name: Configurar .env da API
        working-directory: api
        # sed nas chaves que já existem em .env.example, em vez de acrescentar linhas duplicadas
        # no fim do arquivo — não dá pra confiar em qual valor o phpdotenv usaria com a mesma
        # chave duas vezes.
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i "s#^DB_CONNECTION=.*#DB_CONNECTION=sqlite#" .env
          sed -i "s#^DB_DATABASE=.*#DB_DATABASE=${PWD}/database/database.sqlite#" .env
          sed -i "s#^CACHE_STORE=.*#CACHE_STORE=array#" .env
          sed -i "s#^ADMIN_EMAIL=.*#ADMIN_EMAIL=${ADMIN_EMAIL}#" .env
          sed -i "s#^ADMIN_PASSWORD=.*#ADMIN_PASSWORD=${ADMIN_PASSWORD}#" .env

      - name: Migrar e semear o banco
        working-directory: api
        run: php artisan migrate --seed --force

      - name: Subir a API (php artisan serve)
        working-directory: api
        run: |
          nohup php artisan serve --port=8000 > ../api-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/up && exit 0
            sleep 2
          done
          echo "API não respondeu em http://localhost:8000/up a tempo" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências do npm
        working-directory: web
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Subir o web (ng serve)
        working-directory: web
        run: |
          nohup npm start -- --port=4200 > ../web-serve.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4200 && exit 0
            sleep 2
          done
          echo "web não respondeu em http://localhost:4200 a tempo" >&2
          exit 1

      - name: Rodar o e2e
        working-directory: web
        run: npm run e2e

      - name: Logs da API e do web (se falhar)
        if: failure()
        run: |
          echo "::group::API"; cat api-serve.log || true; echo "::endgroup::"
          echo "::group::Web"; cat web-serve.log || true; echo "::endgroup::"

      - name: Publicar relatório do Playwright (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
